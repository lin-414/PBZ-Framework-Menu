; PBZ Menu Framework prototype config
; Values are rewritten by the in-game menu on save.

[framework]
language = zh-CN
toggle_key = F8
; 输入后端(方案 C)。auto = 装了引擎版(PBZFM_ENGINE_PORT=ON 的 DLL)且 UE4SS 在进程里
; 就用引擎内冻结,否则回退到旧的全局钩子路径;engine = 强制引擎(不可用会写日志并回退);
; os = 强制旧路径(全局 LL 钩子 + Raw Input 改指向,0.5.x 行为)。
; 引擎模式不装全局钩子、不动 Raw Input,所以录屏/截图/游戏栏的全局热键在菜单打开时照常有效。
input_mode = auto
; 菜单打开期间放行给全局截图工具的组合键,逗号分隔;可用修饰前缀
; Ctrl+ / Shift+ / Alt+(不支持 Win+,Win 键需留给系统),留空关闭。按你工具的实际热键配置(PixPin 本机为
; Ctrl+P),改动后重启游戏生效。用法:菜单打开时按第一下开启借用(画面不变属正常),
; 再按一下同样的键,PixPin/N卡 即正常截图。游戏内"设置"页可直接编辑本组键。
passthrough_keys = Ctrl+P, Alt+F1
; 框架在开启借用的同时会合成完整组合键重放;PixPin/N卡实测会忽略注入按键(LLKHF_INJECTED),
; 对它们仍需真实再按一次。接受注入按键的工具则第一下即触发。保持 true 即可。
passthrough_replay = true

[ui]
ui_scale = 1.00
ui_opacity = 0.94

[demo]
fov = 90.0
freeze = false
quality = 1
demo_clicks = 0
